# PMBus Master CLI - CI/CD Pipeline
# This workflow builds, tests, and releases the PMBus Master CLI application

name: Build and Test

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ created ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '6.0.x'
  PROJECT_NAME: 'PmbusMasterCLI'

jobs:
  # Job 1: Build and Test
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_NAME }}.csproj

    - name: Build application
      run: dotnet build ${{ env.PROJECT_NAME }}.csproj -c ${{ matrix.configuration }} --no-restore

    - name: Run tests
      run: dotnet test ${{ env.PROJECT_NAME }}.Tests.csproj -c ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

    - name: Publish application
      run: dotnet publish ${{ env.PROJECT_NAME }}.csproj -c ${{ matrix.configuration }} -o ./publish/${{ matrix.os }} --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: pmbus-cli-${{ matrix.os }}-${{ matrix.configuration }}
        path: ./publish/${{ matrix.os }}

  # Job 2: Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_NAME }}.csproj

    - name: Build with code analysis
      run: dotnet build ${{ env.PROJECT_NAME }}.csproj -c Release /p:TreatWarningsAsErrors=false

    - name: Run code coverage
      run: |
        dotnet test ${{ env.PROJECT_NAME }}.Tests.csproj \
          -c Release \
          --no-build \
          --verbosity normal \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover \
          /p:CoverletOutput=./coverage/

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: '**/coverage/*'

  # Job 3: Create Release Packages
  package:
    name: Create Release Packages
    needs: [build, code-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Create version tag
      id: version
      run: |
        VERSION=$(grep '<Version>' ${{ env.PROJECT_NAME }}.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=${VERSION:-2.0.0}" >> $GITHUB_OUTPUT

    - name: Build Linux x64
      run: |
        dotnet publish ${{ env.PROJECT_NAME }}.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -o ./publish/linux-x64

    - name: Build Windows x64
      run: |
        dotnet publish ${{ env.PROJECT_NAME }}.csproj \
          -c Release \
          -r win-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -o ./publish/win-x64

    - name: Build macOS x64
      run: |
        dotnet publish ${{ env.PROJECT_NAME }}.csproj \
          -c Release \
          -r osx-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -o ./publish/osx-x64

    - name: Create release archives
      run: |
        cd publish
        tar -czf pmbus-cli-v${{ steps.version.outputs.version }}-linux-x64.tar.gz linux-x64/
        zip -r pmbus-cli-v${{ steps.version.outputs.version }}-windows-x64.zip win-x64/
        tar -czf pmbus-cli-v${{ steps.version.outputs.version }}-macos-x64.tar.gz osx-x64/

    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-packages
        path: |
          publish/*.tar.gz
          publish/*.zip

    - name: Create GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          publish/*.tar.gz
          publish/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Docker Build
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t pmbus-cli:latest .
        docker build --target export -o bin .

    - name: Upload Docker build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: docker-build-artifacts
        path: bin/
